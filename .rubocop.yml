AllCops:
  NewCops: enable
  SuggestExtensions: false
Gemspec/RequiredRubyVersion:
  Enabled: false
Metrics/AbcSize:
  Max: 30
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'
Metrics/ClassLength:
  Max: 200
Metrics/MethodLength:
  Max: 25
Naming/FileName:
  Exclude:
    - 'lib/polyline-normalizer.rb'
Style/Documentation:
  Enabled: false
